name: CMake (Windows, Ubuntu, macOS, DOS)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            preset: debug
          - build_type: Release
            preset: release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          for tool in cmake ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install --formula "$tool"
            fi
          done

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure using the documented preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build using the documented preset
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Build and test without configuring CMake (GCC/Clang)
        if: runner.os != 'Windows' && matrix.build_type == 'Release'
        shell: bash
        run: bash build.sh --backend direct --build-dir build/direct-check --test

      - name: Upload artifacts (Native)
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/${{ matrix.preset }}/bin/
          if-no-files-found: error

  mingw:
    name: Windows MinGW static (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Test Windows helper compiler selection
        shell: pwsh
        run: |
          ./tests/BuildHelperTests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/BuildHelperTests.ps1

      - name: Configure, build and test MinGW preset
        shell: pwsh
        env:
          DISCO_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = (Join-Path $env:DISCO_MSYS2_LOCATION 'ucrt64\bin') + ';' + $env:PATH
          cmake --preset release-mingw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release-mingw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset release-mingw

      - name: Build and test Windows helper
        shell: pwsh
        env:
          DISCO_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = (Join-Path $env:DISCO_MSYS2_LOCATION 'ucrt64\bin') + ';' + $env:PATH
          ./build.ps1 -Backend Make -Compiler g++ -Configuration Release -BuildDir build/helper-mingw -Test

      - name: Upload standalone tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-Release
          path: build/release-mingw/bin/
          if-no-files-found: error

  dos:
    name: DOS cross-compile (DJGPP) (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools + DJGPP toolchain (prebuilt)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl tar bzip2 libfl2
          cd "${GITHUB_WORKSPACE}"
          rm -rf .djgpp
          mkdir -p .djgpp
          curl -L \
            https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2 \
            -o djgpp.tar.bz2
          tar -xjf djgpp.tar.bz2 -C .djgpp --strip-components=1
          chmod -R a+rx .djgpp/bin
          ldd .djgpp/bin/i586-pc-msdosdjgpp-ar | grep -E 'libfl|not found' || true
          test -x .djgpp/bin/i586-pc-msdosdjgpp-g++

      - name: Configure (DOS toolchain)
        run: |
          cmake -S . -B build-dos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISCO_DOS_BUILD=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/dos-djgpp.cmake

      - name: Build (DOS)
        run: |
          cmake --build build-dos

      - name: Upload artifacts (DOS)
        uses: actions/upload-artifact@v4
        with:
          name: dos-Release
          path: build-dos/bin/
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: cmake --preset sanitizers

      - name: Build
        run: cmake --build --preset sanitizers

      - name: Test
        run: ctest --preset sanitizers
