[project]
name = "gem-chess"
target = "gsu"
sources = ["main.dc"]

[compiler]
optimization_level = 2

[target.gsu]
memory_mapping = "lorom"
execution_memory = "ram"
origin = 0x706000
ram_bank = 0
stack_pointer = 0xEFFE

[runtime]
initialize = true

[output]
directory = "../../../build/gem-chess-scene"
binary = "gem-chess.bin"
assembly = "gem-chess.s"
